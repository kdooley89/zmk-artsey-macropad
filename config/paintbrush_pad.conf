# 128x32 OLED: status while typing, animated critter when idle
# (see boards/shields/paintbrush_pad/status_screen.c)
CONFIG_ZMK_DISPLAY=y

# Milliseconds without a key press before the critter comes out (ZMK default: 30000)
CONFIG_ZMK_IDLE_TIMEOUT=5000

# Keep the OLED on when idle so the critter can play. status_screen.c turns
# the screen off itself after 30 idle minutes, and before deep sleep.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Deep sleep after 15 minutes idle (on battery). Wake by pressing any key.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Stronger Bluetooth radio
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
